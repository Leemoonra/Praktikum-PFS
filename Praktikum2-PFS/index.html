
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 id="judul">Biodata Mahasiswa</h1>

        <p class="deskripsi">
            Berikut adalah biodata mahasiswa Program Studi Teknologi Informasi.
        </p>

        <div class="biodata">
            <p>Nama: <span id="nama">Miftahul Jannah Az-Zahra</span></p>
            <p>NIM: 2511501029</p>
            <p>Program Studi: Teknologi Informasi</p>
            <p>Kelas: A1</p>
            <p id="pesan" class="pesan">Selamat datang di halaman biodata mahasiswa!</p>
        </div>

        <div class="input-group">
            <label for="inputNama">Ubah Nama:</label>
            <input type="text" name="namaMahasiswa" id="inputNama"
                   placeholder="Masukkan nama baru">
        </div>

        <div class="tombol">
            <button id="btnWarna">Ubah Warna Judul</button>
            <button id="btnPesan">Tampilkan Pesan Baru</button>
            <button id="btnParagraf">Ubah Nama Elemen Tag p</button>
            <button id="btnNama">Ubah Nilai Input Nama</button>
            <button id="btnSemua">Ubah Semua Elemen Sekaligus</button>
        </div>
    </div>
</body>
</html>
